name: check

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "prompts/**"
      - "scripts/**"
      - "assets/**"
      - "README.md"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "skills/**"
      - "prompts/**"
      - "scripts/**"
      - "assets/**"
      - "README.md"
      - "package.json"
      - ".github/workflows/**"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Run packaging hygiene check
        run: npm run check

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec
      - name: Hygiene + full spec validation
        run: npm run check:full
