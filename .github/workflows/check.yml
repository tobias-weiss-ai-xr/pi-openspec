name: check

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "prompts/**"
      - "scripts/**"
      - "package.json"
  pull_request:
    paths:
      - "skills/**"
      - "prompts/**"
      - "scripts/**"
      - "package.json"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Run packaging hygiene check
        run: npm run check
